services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stickywall
      POSTGRES_USER: stickywall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stickywall -d stickywall"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgres://stickywall:${POSTGRES_PASSWORD}@db:5432/stickywall?sslmode=disable
      PORT: "8080"
      STATIC_DIR: /app/public
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
